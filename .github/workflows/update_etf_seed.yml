name: 'Pipeline: 1. Update Seed'

on:
  workflow_dispatch:
    # Triggered manually from the GitHub Actions tab

jobs:
  update-etf-seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4 yfinance pandas

      - name: Download Xetra T7 Dump
        run: python scripts/download_t7_dump.py

      - name: Parse Xetra dump and generate Seed List
        run: python scripts/generate_seed.py

      - name: Screen Liquidity and Build ETF Batch
        run: python scripts/build_etf_batch.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update ETF batch targets and seed list from Xetra"
          branch: main
          file_pattern: "config/*"
