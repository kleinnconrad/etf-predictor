name: Update ETF Batch Configuration

on:
  workflow_dispatch:
    # Triggered manually from the GitHub Actions tab

jobs:
  update-etf-seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4 yfinance pandas

      - name: Download Xetra T7 Dump
        run: python scripts/download_t7_dump.py

      - name: Parse Xetra dump and generate Seed List
        run: python scripts/generate_seed.py

      - name: Screen Liquidity and Build ETF Batch
        run: python scripts/build_etf_batch.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update ETF batch targets and seed list from Xetra"
          title: "Update ETF Batch Targets"
          body: |
            Automated Pull Request to update the ETF configuration.
            
            **Executed pipeline steps:**
            1. Downloaded latest Xetra T7 `allTradableInstruments.csv`
            2. Extracted and deduplicated seed list in `all_etfs_seed.txt`
            3. Applied 10-year history and 1M EUR turnover criteria to generate `batch_targets.json`
          branch: auto/update-etf-targets
          base: main
