name: Manual ETF Batch Processor

on:
  workflow_dispatch:

jobs:
  run-batch:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      matrix:
        runner_id: [1, 2, 3]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run ETF Batch Pipeline (Distributed)
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python src/main.py --batch --runner-id ${{ matrix.runner_id }} --total-runners 3

    - name: Save Temporary Batch Artifact
      uses: actions/upload-artifact@v4
      with:
        name: batch-result-${{ matrix.runner_id }}
        path: output/batch_results_runner_${{ matrix.runner_id }}.json
        retention-days: 1

  # Finaler Job, der darauf wartet, dass alle 3 Server fertig sind
  merge-results:
    needs: run-batch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download all partial batch results
      uses: actions/download-artifact@v4
      with:
        path: downloaded_artifacts

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Merge JSONs and Commit
      run: |
        python -c "
        import json, glob, os
        final_results = []
        exec_time = ''
        
        # Iteriere über alle heruntergeladenen Artefakte
        for f in glob.glob('downloaded_artifacts/**/*.json', recursive=True):
            with open(f, 'r') as file:
                data = json.load(file)
                final_results.extend(data.get('results', []))
                if not exec_time:
                    exec_time = data.get('execution_time', '')
                    
        # Baue die finale, konsolidierte JSON auf
        final_output = {
            'execution_time': exec_time,
            'total_processed': len(final_results),
            'results': final_results
        }
        
        # Speichere die Datei direkt in den finalen Ordner
        os.makedirs('artifacts', exist_ok=True)
        with open('artifacts/latest_batch_results.json', 'w', encoding='utf-8') as out:
            json.dump(final_output, out, indent=4)
        "
        
        # Konfiguriere den Git-Bot
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        
        # Füge die Datei hinzu und committe
        git add artifacts/latest_batch_results.json
        git commit -m "Auto-Update: Merged 3-Runner Batch Results [skip ci]" || echo "Keine Änderungen zum Committen gefunden."
        
        # Hole die neuesten Änderungen vom aktuellen Branch und lege den Commit oben drauf
        git pull --rebase origin ${{ github.ref_name }}
        
        # Pushe sicher zurück
        git push origin HEAD:${{ github.ref_name }}