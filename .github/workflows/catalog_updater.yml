name: Auto-Update Variable Catalog

on:
  push:
    paths:
      - 'src/config.py'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    
    # CRITICAL: Grant the action permission to push commits
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run Updater Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_catalog.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/var_catalog.md
          
          # Check if there are any staged changes. If yes, commit and push.
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update var_catalog.md with new config tickers"
            git push
            echo "Changes pushed successfully."
          else
            echo "No changes to commit."
          fi