name: Auto-Update Variable Catalog

on:
  push:
    paths:
      - 'src/config.py'
      - 'src/data_pipeline.py'
  workflow_dispatch:

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install dependencies
        run: pip install google-genai

      # ----------------------------------------------------------------
      # NEW: Enhanced Run Step with Retry Logic (Exponential Backoff)
      # ----------------------------------------------------------------
      - name: Run Updater Script (with Retry)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          max_retries=5
          base_delay=15 # Start with a 15-second delay
          attempt=1
          
          while [ $attempt -le $max_retries ]; do
            echo "Attempt $attempt of $max_retries..."
            
            # Run the Python script and capture its exit code
            python scripts/update_catalog.py
            exit_code=$?
            
            if [ $exit_code -eq 0 ]; then
              echo "Script completed successfully."
              break
            fi
            
            if [ $attempt -eq $max_retries ]; then
              echo "Max retries reached. Failing the step."
              exit $exit_code
            fi
            
            # Calculate exponential backoff: 15s -> 30s -> 60s -> 120s
            sleep_time=$((base_delay * (2 ** (attempt - 1))))
            echo "Script failed (Exit code: $exit_code). Retrying in $sleep_time seconds..."
            sleep $sleep_time
            
            attempt=$((attempt + 1))
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/var_catalog.md
          
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update var_catalog.md with new config tickers"
            git push
            echo "Changes pushed successfully."
          else
            echo "No changes to commit."
          fi