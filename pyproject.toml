[project]
name = "etf-predictor"
version = "0.1.0"
description = "ETF Predictor Application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yfinance==1.7.0",
    "fredapi==0.5.2",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "google-genai==2.28.0",
    "streamlit==1.65.0",
    "python-dotenv==1.2.4"
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules in src/ import each other as top-level modules (e.g. `from config import ...`)
pythonpath = ["src"]

[tool.ruff.lint]
# Pyflakes and the pycodestyle error rules. Listed explicitly because the default
# rule set changes between ruff releases, which would break CI on version bumps.
select = ["E4", "E7", "E9", "F"]
