[project]
name = "etf-predictor"
version = "0.1.0"
description = "ETF Predictor Application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yfinance==1.7.0",
    "fredapi==0.5.2",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "google-genai==2.24.0",
    "streamlit==1.64.0",
    "python-dotenv==1.2.3"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
